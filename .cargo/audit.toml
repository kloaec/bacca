# Configuration for `cargo audit` (RustSec advisory database).
[advisories]
# Only pulled by the GUI toolkit (iced 0.12), not by the libraries nor the CLI. They go away with an
# upgrade of iced. None of them is a known vulnerability.
ignore = [
    "RUSTSEC-2024-0384", # instant: unmaintained
    "RUSTSEC-2024-0436", # paste: unmaintained
    "RUSTSEC-2026-0206", # rustybuzz: unmaintained
    "RUSTSEC-2026-0192", # ttf-parser: unmaintained
    "RUSTSEC-2026-0002", # lru: unsound API (IterMut), not used by us
    "RUSTSEC-2026-0253", # lru: unsound API, not used by us
    "RUSTSEC-2026-0186", # memmap2: unsound API, used by the font loader
]
informational_warnings = ["unmaintained", "unsound", "notice"]

[output]
deny = ["warnings"]
quiet = false
