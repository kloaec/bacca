# Supply chain policy, checked with `cargo deny check` (https://embarkstudios.github.io/cargo-deny/).
# Also run `cargo audit` against the RustSec database, and build with `--locked`.

[graph]
all-features = true

[advisories]
# RustSec advisory database. Vulnerable, unmaintained, unsound and yanked crates fail the check,
# unless explicitly ignored below with a justification.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
    # The following are only pulled by the GUI toolkit (iced 0.12), not by the libraries nor the
    # CLI. They go away with an upgrade of iced.
    { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained, GUI only (iced 0.12)" },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, GUI only (iced 0.12)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, GUI only (iced 0.12)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, GUI only (iced 0.12)" },
]

[bans]
# Wildcard version requirements ("*") can pull anything.
wildcards = "deny"
multiple-versions = "allow"

[sources]
# Only crates.io. No git dependency nor other registry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. Crates dual-licensed under a copyleft license (e.g. "Apache-2.0 OR
# GPL-2.0-only") are accepted through their permissive option.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
