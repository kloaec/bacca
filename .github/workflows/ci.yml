name: CI

on:
  push:
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned by commit hash, not by (movable) tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev pkg-config
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      # --locked: fail instead of silently resolving other versions than the ones in Cargo.lock.
      - run: cargo fmt --all --check
      - run: cargo build --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      # The tools themselves are installed at fixed versions from their own lockfiles.
      - name: Install cargo-audit and cargo-deny
        run: cargo install --locked cargo-audit@0.22.2 cargo-deny@0.20.2
      # Known vulnerabilities (RustSec), yanked crates.
      - run: cargo audit  # configured in .cargo/audit.toml
      # Advisories, allowed sources (crates.io only), licenses, wildcard requirements. See deny.toml.
      - run: cargo deny --locked check
